name = "octo"
main = "apps/web/src/server/index.ts"
compatibility_date = "2026-04-01"
workers_dev = false
preview_urls = false

[observability]
enabled = true

[dev]
port = 37059

[assets]
directory = "./dist/client"
binding = "ASSETS"
run_worker_first = ["/api", "/api/*", "/mcp", "/files", "/files/*"]
not_found_handling = "single-page-application"

[[routes]]
pattern = "octo.hexly.ai"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "octo-db"
database_id = "11111111-1111-1111-1111-111111111111"

[[r2_buckets]]
binding = "FILES"
bucket_name = "octo-files"

[[vectorize]]
binding = "VEC"
index_name = "octo-vec-te3-small-1536"
remote = false

[triggers]
crons = ["17 * * * *"]
