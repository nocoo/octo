name: Pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy after quality gate passes
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  quality:
    uses: ./.github/workflows/quality-slots.yml

  deploy:
    name: Deploy Worker (production)
    needs: [quality]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy == true)
    uses: nocoo/base-ci/.github/workflows/deploy-worker.yml@3703a073693d598159e87f77f99587e586c14cfe # v2026.24
    with:
      runtime-version: "1.4.0"
      install-policy: project
      artifact-name: b1-dist-client
      artifact-path: dist/client
      d1-migrations: true
      d1-databases: octo-db
      environment: production
      concurrency-group: deploy-octo-production
      timeout-minutes: 20
      verify-command: |
        SHORT=$(git rev-parse --short HEAD)
        EXPECTED=$(jq -r .version package.json)
        RESP=$(curl -fsS https://octo.hexly.ai/api/live)
        ACTUAL_SHA=$(echo "$RESP" | jq -r .git_sha)
        ACTUAL_VER=$(echo "$RESP" | jq -r .version)
        test "$ACTUAL_SHA" = "$SHORT"
        test "$ACTUAL_VER" = "$EXPECTED"
      verify-retries: 12
      verify-retry-seconds: 5
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
