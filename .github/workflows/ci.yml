# CI slot standard v1 (nocoo/base-ci docs/slots.md): impl S1, S2, S3, G1, G2, B1, L1, L2, L3, Z1 via quality.yml;
# na L1.5, P1 in slot-status. nocoo/base-ci v2026.12: top-level slot jobs, workflow-lint folded into quality.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@1ea10ecab22b72512399485391603fe03a161016 # v2026.12
    with:
      runtime-version: "1.4.0"
      node-version: "26.12.1"
      install-policy: "project"
      lockfiles: bun.lock
      gitleaks-config: .gitleaks.toml
      coverage-path: "coverage"
      prepare-command: |
        bun run gate:test-skip
        bun run gate:no-remote
        bun run gate:wrangler-vars
        bun run gate:client-fetch
        bun run gate:l1-probes
      test-command: "bun run test:coverage"
      lint-command: "bun run lint"
      typecheck-command: "bun run typecheck"
      build: true
      build-command: "bun run build && ./node_modules/.bin/wrangler deploy --dry-run --outdir dist/worker"
      workflow-lint: true
      workflow-lint-required-workflow: nocoo/base-ci/.github/workflows/deploy-worker.yml
      workflow-lint-yamllint: true
      l2: true
      l2-command: "bun run test:e2e:api"
      l3: true
      l3-browsers: "chromium"
      l3-command: "bun run test:e2e:bdd"
      slot-status: >-
        {"S1": {"status": "impl"},
        "S2": {"status": "impl"},
        "S3": {"status": "impl"},
        "G1": {"status": "impl"},
        "G2": {"status": "impl"},
        "B1": {"status": "impl"},
        "L1": {"status": "impl"},
        "L1.5": {"status": "na", "reason": "未单独接入 @cloudflare/vitest-pool-workers；Miniflare/workerd 集成由 L2 API E2E 承担"},
        "L2": {"status": "impl"},
        "L3": {"status": "impl"},
        "P1": {"status": "na", "reason": "package.json 为 private，不发布 npm 包"},
        "Z1": {"status": "impl"}}
